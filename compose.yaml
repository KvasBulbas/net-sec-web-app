name: net-sec

services:
  nginx:
    image: nginx:stable-alpine
    container_name: net-sec-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    image: net-sec-web-app-dev
    build: .
    restart: unless-stopped
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: net-sec-postgre
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-web_app}
      POSTGRES_USER: ${POSTGRES_USER:-web_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  app_node_modules:
  app_next:
